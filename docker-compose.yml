services:
  db:
    image: mysql:8.0.33
    container_name: respat_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-admin_residuosDB}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-1234}"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - respat_network

  backend:
    build:
      context: ./residuosPatologicos_backEnd
      dockerfile: DockerFile
    container_name: respat_backend
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE:-admin_residuosDB}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD:-1234}"
      APP_FRONTEND_URL: "${APP_FRONTEND_URL:-http://localhost}"
      JWT_SECRET: "${JWT_SECRET:-unaClaveSecretaMuyLargaYSeguraParaResiduosPatologicos2024}"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - respat_network

  frontend:
    build:
      context: ./residuosPatologicos_frontEnd/residuo-pat-frontend
      dockerfile: Dockerfile
    container_name: respat_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - respat_network

volumes:
  db_data:

networks:
  respat_network:
    driver: bridge
