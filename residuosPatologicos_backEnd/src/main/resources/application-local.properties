spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/admin_residuosDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

server.port=${SERVER_PORT:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

jwt.secret=${JWT_SECRET:localDevelopmentSecretForResPatCloudMustBeLongEnough2026}
