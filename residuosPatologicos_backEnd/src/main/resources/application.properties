spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/admin_residuosDB?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.application.name=app_respat
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
jwt.secret=${JWT_SECRET:unaClaveSecretaMuyLargaYSeguraParaResiduosPatologicos2024}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.email.from=no-reply@respat.local
app.email.expose-confirmation-link=true
app.email.require-confirmation=false

# Seed opcional del administrador inicial. En servidor, configurar como variables de entorno.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.reset-password=${APP_ADMIN_RESET_PASSWORD:false}

